<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Lagu Radio Sekolah</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        #requestList {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body><h1>Request Lagu Radio Sekolah</h1>
<form id="requestForm">
    <label for="name">Nama Pengirim (wajib):</label>
    <input type="text" id="name" required><label for="to">Dikirim Untuk (opsional):</label>
<input type="text" id="to">

<label for="songTitle">Judul Lagu (wajib):</label>
<input type="text" id="songTitle" required>

<label for="youtubeLink">Link Video YouTube:</label>
<input type="text" id="youtubeLink" placeholder="Tempel link video di sini">

<label for="message">Pesan (wajib):</label>
<textarea id="message" required></textarea>

<button type="submit">Kirim Request</button>

</form><h2>Daftar Request Lagu</h2>
<div id="requestList"></div><script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('requestForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const to = document.getElementById('to').value;
        const songTitle = document.getElementById('songTitle').value;
        const youtubeLink = document.getElementById('youtubeLink').value || 'Tidak tersedia';
        const message = document.getElementById('message').value;
        
        db.collection("requests").add({
            name, to, songTitle, youtubeLink, message, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            document.getElementById('requestForm').reset();
            loadRequests();
        });
    });

    function loadRequests() {
        const requestList = document.getElementById('requestList');
        requestList.innerHTML = '';
        
        db.collection("requests").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            requestList.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                const requestItem = document.createElement('div');
                requestItem.innerHTML = `<strong>${data.songTitle}</strong> oleh ${data.name} untuk ${data.to || '-'}<br>
                                        <a href="${data.youtubeLink}" target="_blank">${data.youtubeLink}</a><br>
                                        Pesan: ${data.message}<hr>`;
                requestList.appendChild(requestItem);
            });
        });
    }
    
    loadRequests();
</script></body>
</html>
